<script>

(() => {

    const GAME_ID = "ip7yis";

    if (!GAME_URLS[GAME_ID]) return;

    const host = document.getElementById("game-root");

    const shadow = host.attachShadow({
        mode: "closed"
    });

    const frame = document.createElement("iframe");

    frame.src = GAME_URLS[GAME_ID];

    frame.allowFullscreen = true;

    frame.setAttribute(
        "allow",
        "fullscreen; autoplay; encrypted-media; accelerometer; gyroscope"
    );

    frame.style.cssText = `
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        border:0;
    `;

    shadow.appendChild(frame);

})();


    const adOverlay = document.getElementById("ad-overlay");
    const adBox = document.getElementById("ad-box");
    const wideAdSlot = document.getElementById("wide-ad-slot");
    const mediumAdSlot = document.getElementById("medium-ad-slot");
    const adVariants = ["wide", "medium"];
    const adVariantStorageKey = `blog-ad-variant-${window.location.pathname}`;
    let fallbackAdVariantIndex = 0;

    function setAdVariant(variant) {
        adBox.classList.remove("ad-box--medium", "ad-box--wide");
        adBox.classList.add(variant === "medium" ? "ad-box--medium" : "ad-box--wide");
        wideAdSlot.classList.toggle("is-active", variant === "wide");
        mediumAdSlot.classList.toggle("is-active", variant === "medium");
    }

    function getNextAdVariant() {
        let index = fallbackAdVariantIndex;

        try {
            const storedIndex = Number(sessionStorage.getItem(adVariantStorageKey));
            if (Number.isInteger(storedIndex) && storedIndex >= 0) {
                index = storedIndex;
            }
            sessionStorage.setItem(adVariantStorageKey, String(index + 1));
        } catch (error) {
            console.warn("Could not persist ad rotation; using in-memory rotation.", error);
            fallbackAdVariantIndex = index + 1;
        }

        return adVariants[index % adVariants.length];
    }
    const skipAdButton = document.getElementById("skip-ad");
    const autoHideDelay = 30000;
    const reappearDelay = 300000;
    let skipTimer = null;
    let hideTimer = null;
    let reappearTimer = null;

    function showAd() {
        const variant = getNextAdVariant();
        setAdVariant(variant);
        adOverlay.classList.add("show");
        skipAdButton.disabled = true;
        skipAdButton.textContent = "Skip Ad (6)";

        let remaining = 6;
        clearInterval(skipTimer);
        skipTimer = setInterval(() => {
            remaining -= 1;
            if (remaining > 0) {
                skipAdButton.textContent = `Skip Ad (${remaining})`;
                return;
            }

            skipAdButton.textContent = "Skip Ad";
            skipAdButton.disabled = false;
            clearInterval(skipTimer);
        }, 1000);

        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            hideAd();
        }, autoHideDelay);
    }

    function hideAd() {
        adOverlay.classList.remove("show");
        clearInterval(skipTimer);
        clearTimeout(hideTimer);
        skipAdButton.disabled = true;
        skipAdButton.textContent = "Skip Ad";

        clearTimeout(reappearTimer);
        reappearTimer = setTimeout(() => {
            showAd();
        }, reappearDelay);
    }

    skipAdButton.addEventListener("click", () => {
        if (skipAdButton.disabled) return;
        hideAd();
    });

    showAd();
 

</script>
