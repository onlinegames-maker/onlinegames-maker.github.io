<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 – You Found the Hidden Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .error-page {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(120, 80, 255, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .hidden-badge {
            display: inline-block;
            padding: 8px 15px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .error-number {
            font-size: clamp(100px, 20vw, 210px);
            line-height: 0.85;
            font-weight: 900;
            letter-spacing: -12px;
            background: linear-gradient(135deg, #ffffff, #777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .title {
            font-size: clamp(28px, 5vw, 52px);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .title span {
            color: #8b6cff;
        }

        .description {
            max-width: 600px;
            margin: 0 auto 30px;
            color: #999;
            font-size: 16px;
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            padding: 13px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .btn-primary {
            background: #fff;
            color: #111;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.12);
        }

        .btn-secondary {
            border: 1px solid #292933;
            background: #15151c;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #20202a;
            transform: translateY(-3px);
        }

        /* Secret level */
        .secret-level {
            margin: 45px auto 0;
            max-width: 500px;
            padding: 18px;
            border: 1px dashed #292933;
            border-radius: 12px;
            background: rgba(255,255,255,0.025);
            color: #666;
            font-size: 12px;
        }

        .secret-level strong {
            color: #8b6cff;
        }

        /* Floating dots */
        .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #8b6cff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            top: 15%;
            left: 10%;
        }

        .dot:nth-child(2) {
            top: 25%;
            right: 12%;
            animation-delay: 1s;
        }

        .dot:nth-child(3) {
            bottom: 20%;
            left: 18%;
            animation-delay: 2s;
        }

        .dot:nth-child(4) {
            bottom: 15%;
            right: 20%;
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @media (max-width: 600px) {

            .error-page {
                padding: 25px 18px;
            }

            .error-number {
                letter-spacing: -6px;
            }

            .description {
                font-size: 14px;
            }

            .btn {
                width: 100%;
            }

            .secret-level {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="error-page">

        <div class="glow"></div>

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

        <div class="hidden-badge">
            🔐 Secret Area Discovered
        </div>

        <div class="error-number">
            404
        </div>

        <h1 class="title">
            You Found the <span>Hidden Page</span>
        </h1>

        <p class="description">
            Well... this wasn't supposed to be here.
            The page you're looking for has disappeared,
            moved to another level, or was never unlocked.
        </p>

        <div class="secret-level">
            <strong>SECRET LEVEL:</strong>
            You discovered the 404 zone.
            There are still hundreds of games waiting for you.
        </div>

    </div>

</body>
</html>
